<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTO Network Experience Dashboard</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- ECharts -->
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>

    <style>
        /* ============ CSS VARIABLES FOR RESPONSIVE SCALING ============ */
        :root {
            --sidebar-w: clamp(220px, 18vw, 320px);
            --header-h: clamp(38px, 3.5vh, 48px);
            --bottom-h: clamp(150px, 18vh, 220px);
            --gap: clamp(4px, 0.4vw, 8px);
            --pad: clamp(4px, 0.4vw, 8px);
            --card-pad: clamp(12px, 1.2vw, 20px);
            --card-radius: clamp(8px, 0.7vw, 12px);
            --fs-xs: clamp(9px, 0.62vw, 11px);
            --fs-sm: clamp(10px, 0.7vw, 12px);
            --fs-base: clamp(11px, 0.78vw, 14px);
            --fs-lg: clamp(13px, 0.9vw, 16px);
            --fs-xl: clamp(18px, 1.5vw, 28px);
            --fs-hero: clamp(24px, 2.2vw, 36px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0a0e1a;
            color: #f1f5f9;
            overflow: hidden;
        }

        /* ============ DASHBOARD LAYOUT ============ */

        .dashboard {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr var(--sidebar-w);
            grid-template-rows: var(--header-h) 1fr var(--bottom-h);
            gap: var(--gap);
            padding: var(--pad);
            height: 100vh;
            background-color: #0a0e1a;
        }

        /* ============ HEADER ============ */

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(6px, 0.8vh, 12px) clamp(10px, 1vw, 16px);
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: var(--card-radius);
            font-size: var(--fs-lg);
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.5vw, 8px);
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: var(--fs-base);
        }

        .header-controls {
            display: flex;
            gap: clamp(6px, 0.8vw, 12px);
            align-items: center;
        }

        .header-select, .header-btn {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: clamp(4px, 0.5vh, 8px) clamp(8px, 0.8vw, 12px);
            border-radius: calc(var(--card-radius) * 0.75);
            font-size: var(--fs-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .header-select:hover, .header-btn:hover {
            background-color: #374151;
            border-color: #4b5563;
        }

        .header-btn.active {
            background-color: #06b6d4;
            border-color: #06b6d4;
            color: #0a0e1a;
        }

        /* ============ PANELS ============ */

        .panel {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: var(--card-radius);
            padding: var(--card-pad);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title {
            font-size: var(--fs-lg);
            font-weight: 700;
            margin-bottom: clamp(8px, 1vh, 12px);
            color: #e5e7eb;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #374151 transparent;
        }

        .panel-content::-webkit-scrollbar {
            width: 6px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb {
            background-color: #374151;
            border-radius: 3px;
        }

        /* ============ LEFT PANEL: OVERVIEW ============ */

        .left-panel {
            grid-column: 1;
            grid-row: 2;
        }

        .stat-box {
            background-color: #0f1419;
            border: 1px solid #1f2937;
            border-radius: calc(var(--card-radius) * 0.75);
            padding: clamp(8px, 1vh, 12px);
            margin-bottom: clamp(8px, 1vh, 12px);
            font-size: var(--fs-sm);
        }

        .stat-label {
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .stat-value {
            color: #f1f5f9;
            font-size: var(--fs-lg);
            font-weight: 700;
        }

        .stat-badge {
            display: inline-block;
            background-color: #ef4444;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: var(--fs-xs);
            margin-top: 4px;
        }

        /* ============ CENTER: MAP ============ */

        .center-panel {
            grid-column: 2;
            grid-row: 2;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 100%;
            border: 1px solid #1f2937;
            border-radius: var(--card-radius);
            background-color: #0a0e1a;
        }

        /* Split view divider */
        .split-divider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background-color: #06b6d4;
            cursor: col-resize;
            z-index: 100;
            transition: background-color 0.2s ease;
        }

        .split-divider:hover {
            background-color: #0891b2;
            width: 4px;
            left: calc(50% - 1px);
        }

        /* ============ RIGHT PANEL: LOW SPEED LIST ============ */

        .right-panel {
            grid-column: 3;
            grid-row: 2;
        }

        .list-item {
            background-color: #0f1419;
            border: 1px solid #1f2937;
            border-radius: calc(var(--card-radius) * 0.75);
            padding: clamp(8px, 1vh, 12px);
            margin-bottom: clamp(4px, 0.5vh, 8px);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: var(--fs-sm);
        }

        .list-item:hover {
            background-color: #1f2937;
            border-color: #06b6d4;
        }

        .list-item-title {
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 2px;
        }

        .list-item-meta {
            color: #9ca3af;
            font-size: var(--fs-xs);
        }

        .list-item.critical {
            border-left: 3px solid #dc2626;
        }

        .list-item.warning {
            border-left: 3px solid #f87171;
        }

        /* ============ BOTTOM: HISTOGRAM ============ */

        .bottom-panel {
            grid-column: 1 / -1;
            grid-row: 3;
        }

        #histogram {
            width: 100%;
            height: 100%;
        }

        .view-toggle {
            font-size:var(--fs-xs);padding:2px 8px;border-radius:4px;
            border:1px solid #334155;background:transparent;color:#94a3b8;
            cursor:pointer;font-family:inherit;transition:all 0.2s;
        }
        .view-toggle.active {
            background:#06b6d4;color:#0a0e1a;border-color:#06b6d4;font-weight:600;
        }

        /* ============ COLOR LEGEND ============ */

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(8px, 1vw, 16px);
            margin-bottom: clamp(8px, 1vh, 12px);
            padding: clamp(8px, 1vh, 12px);
            background-color: #0f1419;
            border-radius: calc(var(--card-radius) * 0.75);
            border: 1px solid #1f2937;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-xs);
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid #374151;
        }

        /* ============ POPUP STYLES ============ */

        .leaflet-popup-content-wrapper {
            background-color: #1f2937 !important;
            border-radius: var(--card-radius) !important;
            border: 1px solid #374151 !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
        }

        .leaflet-popup-content {
            color: #e5e7eb !important;
            font-size: var(--fs-sm);
            margin: 0 !important;
        }

        .leaflet-popup-tip {
            background-color: #1f2937 !important;
            border-color: #374151 !important;
        }

        /* ============ LOADING INDICATOR ============ */

        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #e5e7eb;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 200;
            display: none;
        }

        .loading-indicator.active {
            display: block;
        }

        /* ============ UTILITY ============ */

        .hidden {
            display: none;
        }

        .badge {
            display: inline-block;
            background-color: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: var(--fs-xs);
            font-weight: 600;
        }

    </style>
</head>
<body>

<div class="dashboard">
    <!-- HEADER -->
    <div class="header">
        <div class="header-logo">📡 CTO Network Experience Dashboard</div>
        <div class="header-controls">
            <select id="citySelector" class="header-select">
                <option value="Bogota">Bogota</option>
                <option value="Medellin" selected>Medellin</option>
                <option value="Cali">Cali</option>
                <option value="Barranquilla">Barranquilla</option>
                <option value="Cartagena">Cartagena</option>
            </select>
            <button id="splitViewBtn" class="header-btn">Split View</button>
            <button id="langToggle" class="header-btn">中文</button>

    </div>

    <!-- LEFT PANEL: OVERVIEW STATS -->
    <div class="left-panel panel">
        <div class="panel-title" data-i18n="overview">Overview</div>
        <div class="panel-content">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #dc2626;"></div>
                    <span>≤1 Mbps</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #f87171;"></div>
                    <span>1-3 Mbps</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #f59e0b;"></div>
                    <span>3-5 Mbps</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #84cc16;"></div>
                    <span>5-8 Mbps</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #10b981;"></div>
                    <span>>8 Mbps</span>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label" data-i18n="totalGrids">Total Grid Cells</div>
                <div class="stat-value" id="totalGridsValue">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label" data-i18n="avgSpeed">Avg DL Speed</div>
                <div class="stat-value" id="avgSpeedValue">0.0 Mbps</div>
            </div>

            <div class="stat-box">
                <div class="stat-label" data-i18n="lowSpeedCount">Low Speed (<3 Mbps)</div>
                <div class="stat-value" id="lowSpeedCountValue">0 <span class="badge">cells</span></div>
            </div>

            <div class="stat-box">
                <div class="stat-label" data-i18n="vsOperatorB">vs Operator B</div>
                <div class="stat-value" id="vsOperatorBValue">-5.2 Mbps</div>
            </div>
        </div>
    </div>

    <!-- CENTER: MAP CONTAINER -->
    <div class="center-panel">
        <div class="map-container" id="mapContainer">
            <div id="map"></div>
            <div class="loading-indicator" id="loadingIndicator">Generating grid data...</div>
            <div class="split-divider hidden" id="splitDivider"></div>
            <div id="splitMapRight" class="hidden" style="position: absolute; top: 0; right: 0; width: 50%; height: 100%; border-radius: var(--card-radius);"></div>
        </div>
    </div>

    <!-- RIGHT PANEL: LOW SPEED CELLS LIST -->
    <div class="right-panel panel">
        <div class="panel-title" data-i18n="alertCells">Alert Cells <span id="alertBadge" class="badge">0</span></div>
        <div class="panel-content" id="lowSpeedList"></div>
    </div>

    <!-- BOTTOM: HISTOGRAM + CITY COMPARISON -->
    <div class="bottom-panel panel" style="display:flex;gap:var(--gap);">
        <div style="flex:1;display:flex;flex-direction:column;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <span class="panel-title" style="margin:0;" data-i18n="distribution">Speed Distribution</span>
                <div style="display:flex;gap:4px;">
                    <button id="btnViewCity" class="view-toggle active" onclick="setHistView('city')"><span data-i18n="currentCity">Current City</span></button>
                    <button id="btnViewAll" class="view-toggle" onclick="setHistView('all')"><span data-i18n="allCities">All Cities</span></button>
                </div>
            </div>
            <div id="histogram" style="flex:1;min-height:0;"></div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;">
            <span class="panel-title" style="margin-bottom:4px;" data-i18n="cityComparison">City Comparison</span>
            <div id="cityCompChart" style="flex:1;min-height:0;"></div>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ============ TRANSLATIONS ============
const TRANSLATIONS = {
    'en': {
        'overview': 'Overview',
        'totalGrids': 'Total Grid Cells',
        'avgSpeed': 'Avg DL Speed',
        'lowSpeedCount': 'Low Speed (<3 Mbps)',
        'vsOperatorB': 'vs Operator B',
        'alertCells': 'Alert Cells',
        'distribution': 'Speed Distribution',
        'currentCity': 'Current City',
        'allCities': 'All Cities',
        'cityComparison': 'City Comparison',
        'speed': 'Speed (Mbps)',
        'users': 'Users',
        'prb': 'PRB%',
        'rsrp': 'RSRP (dBm)',
    },
    'zh': {
        'overview': '概览',
        'totalGrids': '总栅格数',
        'avgSpeed': '平均下行速率',
        'lowSpeedCount': '低速率(<3Mbps)',
        'vsOperatorB': '对比 B运营商',
        'alertCells': '告警栅格',
        'distribution': '速率分布',
        'currentCity': '当前城市',
        'allCities': '全网',
        'cityComparison': '城市对比',
        'speed': '速率 (Mbps)',
        'users': '用户数',
        'prb': 'PRB利用率',
        'rsrp': 'RSRP (dBm)',
    }
};

let currentLang = 'en';

function t(key) {
    return TRANSLATIONS[currentLang][key] || TRANSLATIONS['en'][key];
}

function updateTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const text = t(key);
        if (!el.querySelector('.badge')) {
            el.textContent = text;
        } else {
            el.childNodes[0].textContent = text + ' ';
        }
    });
}

document.getElementById('langToggle').addEventListener('click', () => {
    currentLang = currentLang === 'en' ? 'zh' : 'en';
    document.getElementById('langToggle').textContent = currentLang === 'en' ? '中文' : 'English';
    updateTranslations();
});

// ============ PRNG & DATA GENERATION ============

function mulberry32(a) {
    return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

// City coordinates and bounds for full coverage grid
const CITIES = {
    'Medellin': {
        lat: 6.251, lon: -75.564,
        latMin: 6.15, latMax: 6.35,
        lonMin: -75.65, lonMax: -75.50,
        zoom: 13
    },
    'Bogota': {
        lat: 4.711, lon: -74.072,
        latMin: 4.55, latMax: 4.80,
        lonMin: -74.15, lonMax: -73.95,
        zoom: 12
    },
    'Cali': {
        lat: 3.437, lon: -76.522,
        latMin: 3.35, latMax: 3.55,
        lonMin: -76.60, lonMax: -76.45,
        zoom: 13
    },
    'Barranquilla': {
        lat: 10.964, lon: -74.781,
        latMin: 10.90, latMax: 11.05,
        lonMin: -74.85, lonMax: -74.75,
        zoom: 13
    },
    'Cartagena': {
        lat: 10.391, lon: -75.514,
        latMin: 10.35, latMax: 10.45,
        lonMin: -75.55, lonMax: -75.48,
        zoom: 14
    }
};

// Grid spacing in degrees (approximately 50m at equator)
const GRID_SPACING = 0.00045;

// Generate 50m grid data for full city coverage (fast generation, deterministic)
function generateFullGridData(city, operator = 'tigo') {
    const cfg = CITIES[city];
    const seed = city.charCodeAt(0) * 1234 + (operator === 'opb' ? 5000 : 0);
    const rand = mulberry32(seed);

    const grids = [];

    // Speed baselines by city
    const speedBaselines = {
        'Medellin': { tigo: 8, opb: 7 },
        'Bogota': { tigo: 12, opb: 10 },
        'Cali': { tigo: 6, opb: 5 },
        'Barranquilla': { tigo: 5, opb: 4 },
        'Cartagena': { tigo: 5, opb: 4 }
    };

    const baseline = speedBaselines[city][operator] || 8;

    // Generate grid covering full city bounds at GRID_SPACING
    for (let lat = cfg.latMin; lat < cfg.latMax; lat += GRID_SPACING) {
        for (let lon = cfg.lonMin; lon < cfg.lonMax; lon += GRID_SPACING) {
            // Deterministic speed based on position + operator + city
            const posHash = Math.sin(lat * 12345) * Math.cos(lon * 67890);
            const noise = (rand() - 0.5) * 6;

            let speed = baseline + noise;

            // Create hotspots of congestion (poor speed clusters)
            const blockLat = Math.floor(lat * 100);
            const blockLon = Math.floor(lon * 100);
            const blockHash = (blockLat * 73856093) ^ (blockLon * 19349663);
            const blockRand = mulberry32(blockHash)();

            if (blockRand < 0.08) {
                // Congestion zone
                speed = Math.max(0.5, baseline * 0.3 + (rand() - 0.5) * 2);
            }

            speed = Math.max(0.3, Math.min(25, speed));
            speed = +(speed.toFixed(1));

            grids.push({
                lat: +lat.toFixed(6),
                lon: +lon.toFixed(6),
                dl_speed: speed,
                users: Math.round(20 + rand() * 200),
                prb: Math.round(30 + rand() * 50),
                rsrp: Math.round(-130 + rand() * 40)
            });
        }
    }

    return grids;
}

// ============ CANVAS GRID OVERLAY ============

L.GridCanvas = L.Layer.extend({
    initialize: function(options) {
        L.setOptions(this, options);
        this._data = [];
        this._cellIndex = {};
        this._bounds = null;
    },

    onAdd: function(map) {
        this._map = map;
        this._canvas = L.DomUtil.create('canvas', 'grid-canvas');
        this._canvas.style.position = 'absolute';
        this._canvas.style.pointerEvents = 'none';
        this._canvas.style.zIndex = '10';
        map.getPanes().overlayPane.appendChild(this._canvas);

        map.on('moveend zoomend resize', this._redraw, this);
        this._redraw();
    },

    _redraw: function() {
        if (!this._map || !this._canvas) return;

        const map = this._map;
        const size = map.getSize();
        this._canvas.width = size.x;
        this._canvas.height = size.y;
        this._canvas.style.left = '0px';
        this._canvas.style.top = '0px';

        const ctx = this._canvas.getContext('2d');
        ctx.clearRect(0, 0, size.x, size.y);

        const bounds = map.getBounds();
        const zoom = map.getZoom();

        // Only render visible cells (frustum culling)
        let rendered = 0;
        this._data.forEach(cell => {
            // Quick bounds check
            if (cell.lat < bounds.getSouth() || cell.lat > bounds.getNorth()) return;
            if (cell.lon < bounds.getWest() || cell.lon > bounds.getEast()) return;

            const p = map.latLngToContainerPoint([cell.lat, cell.lon]);
            const p2 = map.latLngToContainerPoint([cell.lat + GRID_SPACING, cell.lon + GRID_SPACING]);

            const w = Math.max(1, Math.abs(p2.x - p.x));
            const h = Math.max(1, Math.abs(p2.y - p.y));

            ctx.fillStyle = cell.color;
            ctx.globalAlpha = 0.7;
            ctx.fillRect(p.x, p.y, w, h);

            rendered++;
        });
    },

    setData: function(data) {
        this._data = data;
        this._buildIndex();
        if (this._map) this._redraw();
    },

    _buildIndex: function() {
        this._cellIndex = {};
        this._data.forEach(cell => {
            const key = cell.lat.toFixed(6) + ',' + cell.lon.toFixed(6);
            this._cellIndex[key] = cell;
        });
    },

    getCellAtLatLng: function(lat, lon) {
        const gridLat = Math.round(lat / GRID_SPACING) * GRID_SPACING;
        const gridLon = Math.round(lon / GRID_SPACING) * GRID_SPACING;
        const key = gridLat.toFixed(6) + ',' + gridLon.toFixed(6);
        return this._cellIndex[key];
    },

    onRemove: function(map) {
        map.getPanes().overlayPane.removeChild(this._canvas);
        map.off('moveend zoomend resize', this._redraw, this);
    }
});

L.gridCanvas = function(options) {
    return new L.GridCanvas(options);
};

// ============ GLOBAL STATE ============

let map = null;
let splitMapRight = null;
let gridCanvasLeft = null;
let gridCanvasRight = null;

let tigoGrids = {};
let opbGrids = {};
let currentCity = 'Medellin';
let splitViewActive = false;

// ============ COLOR & UTILITY ============

function getSpeedColor(speed) {
    if (speed <= 1) return '#dc2626';      // deep red
    if (speed <= 3) return '#f87171';      // light red
    if (speed <= 5) return '#f59e0b';      // yellow
    if (speed <= 8) return '#84cc16';      // light green
    return '#10b981';                      // deep green
}

function showLoadingIndicator(show) {
    const indicator = document.getElementById('loadingIndicator');
    if (show) {
        indicator.classList.add('active');
    } else {
        indicator.classList.remove('active');
    }
}

// ============ MAP INITIALIZATION ============

function initMap() {
    const cityCoord = CITIES[currentCity];

    map = L.map('map', {
        center: [cityCoord.lat, cityCoord.lon],
        zoom: cityCoord.zoom,
        zoomControl: true,
        attributionControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: ''
    }).addTo(map);

    // Create canvas overlay for grids
    gridCanvasLeft = L.gridCanvas().addTo(map);

    // Generate and load grid data for current city
    loadCityGrids(currentCity).then(() => {
        renderGridsOnCanvas(map, gridCanvasLeft, 'tigo');
        updateStats();
        updateLowSpeedList();
        updateHistogram(); updateCityComparison();
    });

    // Click handler for grid interaction
    map.on('click', (e) => {
        const cell = gridCanvasLeft.getCellAtLatLng(e.latlng.lat, e.latlng.lng);
        if (cell) {
            const popupContent = `
                <div style="font-size: 12px;">
                    <strong>Speed: ${cell.dl_speed} Mbps</strong><br>
                    Users: ${cell.users}<br>
                    PRB: ${cell.prb}%<br>
                    RSRP: ${cell.rsrp} dBm
                </div>
            `;
            L.popup()
                .setLatLng(e.latlng)
                .setContent(popupContent)
                .openOn(map);
        }
    });
}

// Lazy load grid data for a city
function loadCityGrids(city) {
    return new Promise((resolve) => {
        if (tigoGrids[city] && opbGrids[city]) {
            resolve();
            return;
        }

        showLoadingIndicator(true);

        // Offload generation to next tick to avoid blocking
        setTimeout(() => {
            if (!tigoGrids[city]) {
                tigoGrids[city] = generateFullGridData(city, 'tigo');
            }
            if (!opbGrids[city]) {
                opbGrids[city] = generateFullGridData(city, 'opb');
            }

            showLoadingIndicator(false);
            resolve();
        }, 10);
    });
}

// Render grids on canvas with color coding
function renderGridsOnCanvas(mapInstance, canvasOverlay, operator = 'tigo') {
    const grids = operator === 'tigo' ? tigoGrids[currentCity] : opbGrids[currentCity];
    if (!grids) return;

    // Add color to each cell
    const coloredGrids = grids.map(grid => ({
        ...grid,
        color: getSpeedColor(grid.dl_speed)
    }));

    canvasOverlay.setData(coloredGrids);
}

// ============ STATS & LISTS ============

function updateStats() {
    const grids = tigoGrids[currentCity] || [];
    const opbGrids_current = opbGrids[currentCity] || [];

    const totalGrids = grids.length;
    const avgSpeed = grids.length > 0
        ? (grids.reduce((sum, g) => sum + g.dl_speed, 0) / grids.length).toFixed(1)
        : 0;
    const lowSpeedCount = grids.filter(g => g.dl_speed < 3).length;
    const opbAvgSpeed = opbGrids_current.length > 0
        ? (opbGrids_current.reduce((sum, g) => sum + g.dl_speed, 0) / opbGrids_current.length).toFixed(1)
        : 0;
    const diff = (avgSpeed - opbAvgSpeed).toFixed(1);

    document.getElementById('totalGridsValue').textContent = totalGrids.toLocaleString();
    document.getElementById('avgSpeedValue').textContent = avgSpeed + ' Mbps';
    document.getElementById('lowSpeedCountValue').innerHTML = lowSpeedCount.toLocaleString() + ' <span class="badge">cells</span>';
    document.getElementById('vsOperatorBValue').textContent = (diff > 0 ? '+' : '') + diff + ' Mbps';
    document.getElementById('alertBadge').textContent = lowSpeedCount.toLocaleString();
}

function updateLowSpeedList() {
    const grids = tigoGrids[currentCity] || [];
    const lowSpeedGrids = grids
        .filter(g => g.dl_speed < 3)
        .sort((a, b) => a.dl_speed - b.dl_speed)
        .slice(0, 100);  // Show top 100 worst cells

    const listHtml = lowSpeedGrids.map((grid, idx) => {
        const isCritical = grid.dl_speed <= 1;
        const className = isCritical ? 'list-item critical' : 'list-item warning';

        return `
            <div class="${className}" onclick="zoomToGrid(${grid.lat}, ${grid.lon})">
                <div class="list-item-title">Cell #${idx + 1} (${grid.dl_speed} Mbps)</div>
                <div class="list-item-meta">
                    Users: ${grid.users} | PRB: ${grid.prb}% | RSRP: ${grid.rsrp}
                </div>
            </div>
        `;
    }).join('');

    const lowSpeedCount = grids.filter(g => g.dl_speed < 3).length;
    const message = lowSpeedCount > 100
        ? `Showing top 100 of ${lowSpeedCount.toLocaleString()} cells`
        : lowSpeedCount === 0
            ? 'No cells <3 Mbps in this view'
            : `Showing all ${lowSpeedCount} cells`;

    document.getElementById('lowSpeedList').innerHTML = listHtml
        ? (message !== 'No cells <3 Mbps in this view'
            ? `<div style="color: #9ca3af; padding: 8px 0; font-size: var(--fs-xs); margin-bottom: 8px;">${message}</div>${listHtml}`
            : listHtml)
        : `<div style="color: #9ca3af; padding: 12px;">${message}</div>`;
}

function zoomToGrid(lat, lon) {
    if (map) {
        map.setView([lat, lon], 16);
    }
}

// ============ HISTOGRAM + CITY COMPARISON ============

var histView = 'city'; // 'city' or 'all'
var histChart = null;
var cityCompChart = null;

function setHistView(view) {
    histView = view;
    document.getElementById('btnViewCity').classList.toggle('active', view === 'city');
    document.getElementById('btnViewAll').classList.toggle('active', view === 'all');
    updateHistogram(); updateCityComparison();
}

function binGrids(grids) {
    var bins = {'≤1':0, '1-3':0, '3-5':0, '5-8':0, '>8':0};
    grids.forEach(function(g) {
        var s = g.dl_speed;
        if (s <= 1) bins['≤1']++;
        else if (s <= 3) bins['1-3']++;
        else if (s <= 5) bins['3-5']++;
        else if (s <= 8) bins['5-8']++;
        else bins['>8']++;
    });
    return bins;
}

function updateHistogram() {
    var grids;
    var title;
    if (histView === 'all') {
        grids = [];
        Object.values(tigoGrids).forEach(function(g) { grids = grids.concat(g); });
        title = 'All Cities';
    } else {
        grids = tigoGrids[currentCity] || [];
        title = currentCity;
    }

    var bins = binGrids(grids);
    var total = grids.length;
    var labels = Object.keys(bins);
    var binColors = ['#dc2626','#f87171','#f59e0b','#84cc16','#10b981'];

    if (!histChart) histChart = echarts.init(document.getElementById('histogram'));
    histChart.setOption({
        title: {text: title + ' (' + total.toLocaleString() + ' grids)', left:'center', top:0, textStyle:{color:'#94a3b8',fontSize:11}},
        tooltip: {trigger:'axis', formatter: function(p) {
            var d = p[0]; var pct = total > 0 ? (d.value/total*100).toFixed(1) : 0;
            return d.name + ' Mbps<br/>' + d.value.toLocaleString() + ' grids (' + pct + '%)';
        }},
        grid: {left:50,right:20,top:30,bottom:30},
        xAxis: {type:'category', data:labels.map(function(l){return l+' Mbps'}),
            axisLabel:{color:'#9ca3af',fontSize:10}, axisLine:{lineStyle:{color:'#374151'}}},
        yAxis: {type:'value', axisLabel:{color:'#9ca3af',fontSize:10,
            formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'K':v}},
            axisLine:{lineStyle:{color:'#374151'}}, splitLine:{lineStyle:{color:'#1f2937'}}},
        series: [{type:'bar', data:labels.map(function(l,i){return {value:bins[l],itemStyle:{color:binColors[i]}}}),
            barWidth:'60%', label:{show:true, position:'top', color:'#94a3b8', fontSize:9,
            formatter:function(p){return total>0?(p.value/total*100).toFixed(0)+'%':''}}}],
        textStyle:{color:'#e5e7eb'}
    });
}

function updateCityComparison() {
    var cityNames = Object.keys(CITIES);
    var binLabels = ['≤1','1-3','3-5','5-8','>8'];
    var binColors = ['#dc2626','#f87171','#f59e0b','#84cc16','#10b981'];

    // Build per-city bin data
    var seriesData = binLabels.map(function(label, idx) {
        return {
            name: label + ' Mbps',
            type: 'bar',
            stack: 'total',
            itemStyle: {color: binColors[idx]},
            data: cityNames.map(function(city) {
                var grids = tigoGrids[city] || [];
                var bins = binGrids(grids);
                return bins[label];
            }),
            label: {show: false}
        };
    });

    // Also compute summary row
    var summaryData = cityNames.map(function(city) {
        var grids = tigoGrids[city] || [];
        var low = grids.filter(function(g){return g.dl_speed < 3}).length;
        var total = grids.length;
        return {city: city, total: total, low: low, pct: total > 0 ? (low/total*100).toFixed(1) : 0,
            avg: total > 0 ? (grids.reduce(function(s,g){return s+g.dl_speed},0)/total).toFixed(1) : 0};
    });

    if (!cityCompChart) cityCompChart = echarts.init(document.getElementById('cityCompChart'));
    cityCompChart.setOption({
        tooltip: {trigger:'axis', formatter: function(params) {
            var city = params[0].axisValue;
            var sd = summaryData.find(function(s){return s.city===city});
            var html = '<b>'+city+'</b> ('+sd.total.toLocaleString()+' grids)<br/>';
            html += 'Avg: '+sd.avg+' Mbps | <3Mbps: <span style="color:#ef4444">'+sd.low.toLocaleString()+' ('+sd.pct+'%)</span><br/><br/>';
            params.forEach(function(p){
                html += '<span style="color:'+p.color+'">●</span> '+p.seriesName+': '+p.value.toLocaleString()+'<br/>';
            });
            return html;
        }},
        legend: {data: binLabels.map(function(l){return l+' Mbps'}), bottom:0, textStyle:{color:'#9ca3af',fontSize:9}, itemWidth:10, itemHeight:8},
        grid: {left:50,right:10,top:15,bottom:35},
        xAxis: {type:'category', data:cityNames,
            axisLabel:{color:'#9ca3af',fontSize:10,rotate:15}, axisLine:{lineStyle:{color:'#374151'}}},
        yAxis: {type:'value', axisLabel:{color:'#9ca3af',fontSize:10,
            formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'K':v}},
            axisLine:{lineStyle:{color:'#374151'}}, splitLine:{lineStyle:{color:'#1f2937'}}},
        series: seriesData,
        textStyle:{color:'#e5e7eb'}
    });
}

// ============ EVENT HANDLERS ============

document.getElementById('citySelector').addEventListener('change', (e) => {
    currentCity = e.target.value;

    loadCityGrids(currentCity).then(() => {
        const cityCoord = CITIES[currentCity];
        map.setView([cityCoord.lat, cityCoord.lon], cityCoord.zoom);

        renderGridsOnCanvas(map, gridCanvasLeft, 'tigo');
        if (splitViewActive && gridCanvasRight) {
            renderGridsOnCanvas(splitMapRight, gridCanvasRight, 'opb');
        }

        updateStats();
        updateLowSpeedList();
        updateHistogram(); updateCityComparison();
    });
});

document.getElementById('splitViewBtn').addEventListener('click', () => {
    splitViewActive = !splitViewActive;
    const btn = document.getElementById('splitViewBtn');
    const divider = document.getElementById('splitDivider');

    if (splitViewActive) {
        btn.classList.add('active');
        divider.classList.remove('hidden');

        if (!splitMapRight) {
            const rightContainer = document.getElementById('splitMapRight');
            rightContainer.classList.remove('hidden');

            const cityCoord = CITIES[currentCity];
            splitMapRight = L.map(rightContainer, {
                center: [cityCoord.lat, cityCoord.lon],
                zoom: map.getZoom(),
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(splitMapRight);

            gridCanvasRight = L.gridCanvas().addTo(splitMapRight);

            // Ensure data is loaded
            loadCityGrids(currentCity).then(() => {
                renderGridsOnCanvas(splitMapRight, gridCanvasRight, 'opb');

                // Sync maps
                let syncingLeft = false;
                let syncingRight = false;

                const onLeftMove = () => {
                    if (syncingLeft) return;
                    syncingRight = true;
                    splitMapRight.setView(map.getCenter(), map.getZoom());
                    syncingRight = false;
                };

                const onRightMove = () => {
                    if (syncingRight) return;
                    syncingLeft = true;
                    map.setView(splitMapRight.getCenter(), splitMapRight.getZoom());
                    syncingLeft = false;
                };

                map.on('move', onLeftMove);
                splitMapRight.on('move', onRightMove);
            });

            // Click handler for right map
            splitMapRight.on('click', (e) => {
                const cell = gridCanvasRight.getCellAtLatLng(e.latlng.lat, e.latlng.lng);
                if (cell) {
                    const popupContent = `
                        <div style="font-size: 12px;">
                            <strong>Speed: ${cell.dl_speed} Mbps</strong><br>
                            Users: ${cell.users}<br>
                            PRB: ${cell.prb}%<br>
                            RSRP: ${cell.rsrp} dBm
                        </div>
                    `;
                    L.popup()
                        .setLatLng(e.latlng)
                        .setContent(popupContent)
                        .openOn(splitMapRight);
                }
            });
        }
    } else {
        btn.classList.remove('active');
        divider.classList.add('hidden');
        document.getElementById('splitMapRight').classList.add('hidden');
        if (splitMapRight) {
            splitMapRight.remove();
            splitMapRight = null;
            gridCanvasRight = null;
        }
    }
});

// ============ INITIALIZATION ============

window.addEventListener('load', () => {
    initMap();
    updateTranslations();
});

window.addEventListener('resize', () => {
    if (map) map.invalidateSize();
    if (splitMapRight) splitMapRight.invalidateSize();
    if (histChart) histChart.resize();
    if (cityCompChart) cityCompChart.resize();
});

</script>
